[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agtcld"
version = "0.1.3"
description = "AgentCloud AI — your private cloud solutions agent: ask, design & visualize cloud architectures, grounded in official docs (AWS & Azure today; GCP coming soon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ruturaj Dixit" }]
keywords = ["aws", "rag", "llm", "agent", "architecture", "cloud", "bedrock", "chatbot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "llama-index-core>=0.12",
  "llama-index-readers-file",              # PDF/DOCX/etc. support for SimpleDirectoryReader
  "pymupdf",                               # fast PDF text extraction (~20x faster than pypdf)
  "llama-index-vector-stores-chroma",      # embedded Chroma store (default, no server)
  "chromadb",
  "llama-index-embeddings-huggingface",    # local embedding models (BGE, E5, ...)
  "llama-index-embeddings-openai",         # OpenAI embedding API
  "llama-index-llms-openai",               # OpenAI chat models
  "llama-index-llms-openai-like",          # any OpenAI-compatible server (vLLM)
  "sentence-transformers",                 # cross-encoder reranker
  "httpx",                                 # downloader
  "pydantic-settings>=2",
  "fastapi",                               # web UI + API (rag-app serve / agtcld)
  "uvicorn",                               # ASGI server
  "python-multipart",
]

[project.optional-dependencies]
postgres = ["llama-index-vector-stores-postgres"]   # RAG_VECTOR_BACKEND=pgvector
web = ["llama-index-readers-web"]                   # index web pages (SimpleWebPageReader)
browser = ["playwright"]                            # crawl JS-rendered sites
image = ["diffusers", "accelerate"]                 # optional AI-art render
dev = ["pytest", "build"]

[project.scripts]
agtcld = "rag_app.agent_cli:main"
agentcloud = "rag_app.agent_cli:main"
rag-app = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_app = ["web/static/*"]

[project.urls]
Homepage = "https://agentcloudai.github.io/"
Repository = "https://github.com/agentcloudai/agentcloud"
Issues = "https://github.com/agentcloudai/agentcloud/issues"
