# AgentCloud AI — your private multi-cloud architect. Two commands:
#
#   curl -LfO https://raw.githubusercontent.com/agentcloudai/agentcloud/main/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8000 and paste your OpenAI key when it asks (or put
# OPENAI_API_KEY=sk-... in a .env file next to this one to skip the prompt).
#
# The image already contains the vector index for AWS, Azure and Google Cloud, so
# there is nothing to download or ingest and it works with no internet access.
# Upgrade with:
#   docker compose pull && docker compose up -d
#
# To build your OWN index instead, use a slim image
# (docker build --build-arg WITH_INDEX=false) and run any of:
#   docker compose run --rm app rag-app ingest-gcp
#   docker compose run --rm app rag-app download --csv aws_service_guides.csv
#   docker compose run --rm app rag-app index
#   docker compose run --rm app sh -c "git clone --depth 1 --filter=blob:none --sparse https://github.com/MicrosoftDocs/azure-docs /app/data/_azure_src && rag-app ingest-azure --src /app/data/_azure_src"
#
# Postgres/pgvector is OPTIONAL (large / multi-tenant):
#   RAG_VECTOR_BACKEND=pgvector docker compose --profile pgvector up -d
#
services:
  app:
    image: ghcr.io/agentcloudai/agentcloud:latest
    # To hack on the code instead of pulling, comment the line above and uncomment:
    # build: .
    pull_policy: always
    ports:
      - "8000:8000"                 # web UI → http://localhost:8000
    environment:
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-chroma}
      RAG_DATA_DIR: /app/data
      # NOTE: do not set RAG_CHROMA_PATH here — the image points it at the
      # baked-in index (/opt/index). Overriding it hides that index.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Only used by slim images that ship without the index baked in: point these
      # at your own bundle and it is downloaded (and checksum-verified) on first
      # boot. The default image needs neither.
      RAG_INDEX_URL: ${RAG_INDEX_URL:-}
      RAG_INDEX_SHA256: ${RAG_INDEX_SHA256:-}
      # Used only when RAG_VECTOR_BACKEND=pgvector:
      RAG_PG_HOST: db
      RAG_PG_PORT: "5432"
      RAG_PG_USER: rag
      RAG_PG_PASSWORD: rag
      RAG_PG_DATABASE: rag
    volumes:
      - agentcloud-data:/app/data   # your key, feedback and anything you ingest
    restart: unless-stopped

  # Optional: only started with `--profile pgvector`.
  db:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agentcloud-data:
  pgdata:
