# AgentCloud AI — your private multi-cloud architect. Two commands:
#
#   curl -LfO https://raw.githubusercontent.com/agentcloudai/agentcloud/main/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8000 and paste your OpenAI key when it asks (or put
# OPENAI_API_KEY=sk-... in a .env file next to this one to skip the prompt).
#
# First boot downloads the prebuilt index — AWS, Azure and Google Cloud — into the
# volume, so there is nothing to ingest. Upgrade with:
#   docker compose pull && docker compose up -d
#
# To build your OWN index instead, set RAG_INDEX_URL= (blank) and run any of:
#   docker compose run --rm app rag-app ingest-gcp
#   docker compose run --rm app rag-app download --csv aws_service_guides.csv
#   docker compose run --rm app rag-app index
#   docker compose run --rm app sh -c "git clone --depth 1 --filter=blob:none --sparse https://github.com/MicrosoftDocs/azure-docs /app/data/_azure_src && rag-app ingest-azure --src /app/data/_azure_src"
#
# Postgres/pgvector is OPTIONAL (large / multi-tenant):
#   RAG_VECTOR_BACKEND=pgvector docker compose --profile pgvector up -d
#
services:
  app:
    image: ghcr.io/agentcloudai/agentcloud:latest
    # To hack on the code instead of pulling, comment the line above and uncomment:
    # build: .
    pull_policy: always
    ports:
      - "8000:8000"                 # web UI → http://localhost:8000
    environment:
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-chroma}
      RAG_DATA_DIR: /app/data
      RAG_CHROMA_PATH: /app/data/chroma
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Prebuilt multi-cloud index (AWS + Azure + GCP, 440k chunks). On first boot
      # the container downloads it into the volume, so the app already knows all
      # three clouds with no indexing step. Override with your own bundle, or set
      # it empty to start blank and build one with the ingest commands.
      RAG_INDEX_URL: ${RAG_INDEX_URL:-https://huggingface.co/datasets/rdprojects/agentcloud/resolve/main/agentcloud-index.tar.gz}
      # Used only when RAG_VECTOR_BACKEND=pgvector:
      RAG_PG_HOST: db
      RAG_PG_PORT: "5432"
      RAG_PG_USER: rag
      RAG_PG_PASSWORD: rag
      RAG_PG_DATABASE: rag
    volumes:
      - agentcloud-data:/app/data   # the vector index + downloaded docs persist here
    restart: unless-stopped

  # Optional: only started with `--profile pgvector`.
  db:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agentcloud-data:
  pgdata:
