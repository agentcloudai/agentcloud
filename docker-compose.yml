# AgentCloud AI — run the whole app with one command (Airflow-style, no pip):
#
#   curl -LfO https://raw.githubusercontent.com/agentcloudai/agentcloud/main/docker-compose.yml
#   echo "OPENAI_API_KEY=sk-..." > .env       # needed for ask/design (not for indexing)
#   docker compose up -d                        # pulls the image, starts the web UI
#   # open http://localhost:8000
#
# First time, build a knowledge base into the mounted volume (pick any/all):
#   docker compose run --rm app rag-app download --csv aws_service_guides.csv && \
#     docker compose run --rm app rag-app index          # AWS
#   docker compose run --rm app rag-app ingest-gcp        # Google Cloud
#   docker compose run --rm app rag-app ingest-azure --src /app/data/_azure_src   # Azure
#
# Postgres/pgvector is OPTIONAL (large / multi-tenant):
#   RAG_VECTOR_BACKEND=pgvector docker compose --profile pgvector up -d
#
services:
  app:
    image: ghcr.io/agentcloudai/agentcloud:latest
    # To hack on the code instead of pulling, comment the line above and uncomment:
    # build: .
    pull_policy: always
    ports:
      - "8000:8000"                 # web UI → http://localhost:8000
    environment:
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-chroma}
      RAG_DATA_DIR: /app/data
      RAG_CHROMA_PATH: /app/data/chroma
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Prebuilt multi-cloud index (AWS + Azure + GCP, 440k chunks). On first boot
      # the container downloads it into the volume, so the app already knows all
      # three clouds with no indexing step. Override with your own bundle, or set
      # it empty to start blank and build one with the ingest commands.
      RAG_INDEX_URL: ${RAG_INDEX_URL:-https://huggingface.co/datasets/rdprojects/agentcloud/resolve/main/agentcloud-index.tar.gz}
      # Used only when RAG_VECTOR_BACKEND=pgvector:
      RAG_PG_HOST: db
      RAG_PG_PORT: "5432"
      RAG_PG_USER: rag
      RAG_PG_PASSWORD: rag
      RAG_PG_DATABASE: rag
    volumes:
      - agentcloud-data:/app/data   # the vector index + downloaded docs persist here
    restart: unless-stopped

  # Optional: only started with `--profile pgvector`.
  db:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agentcloud-data:
  pgdata:
